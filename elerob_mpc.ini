# Standalone MPC config - does NOT modify /usr/local/eleconf/myCobot_Pro_630/
# Use: linuxcnc /home/pi/Desktop/mpc/config/elerob_mpc.ini
# Shared files (var, tbl) from original config

[EMC]
VERSION = 1.1
MACHINE = Elephantrobotics_MPC
DEBUG = 0

[DISPLAY]
DISPLAY = elephantmonitor
CYCLE_TIME = 0.100
HELP_FILE = tklinucnc.txt
POSITION_OFFSET = MACHINE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 2.0
PROGRAM_PREFIX = ../../nc_files/

[RS274NGC]
PARAMETER_FILE = /usr/local/eleconf/myCobot_Pro_630/elerob.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
COMM_WAIT = 0.010
SERVO_PERIOD = 10000000
TRAJ_PERIOD  = 100000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALFILE = elerob_mpc.hal
POSTGUI_HALFILE = /usr/local/eleconf/myCobot_Pro_630/elerob_gpio.hal

[HALUI]

[TRAJ]
COORDINATES = X Y Z A B C
LINEAR_UNITS = mm
DEFAULT_LINEAR_VELOCITY = 400.0
MAX_LINEAR_VELOCITY = 1200.0
DEFAULT_LINEAR_ACCELERATION = 600.0
MAX_LINEAR_ACCELERATION = 3000.0
ANGULAR_UNITS = degree
DEFAULT_ANGULAR_VELOCITY = 240.0
MAX_ANGULAR_VELOCITY = 400
DEFAULT_ANGULAR_ACCELERATION = 600.0
MAX_ANGULAR_ACCELERATION = 3000.0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = /usr/local/eleconf/myCobot_Pro_630/elerob.tbl

[KINS]
KINEMATICS = pandakins
JOINTS = 6

[AXIS_X]
MAX_VELOCITY = 180.0
MAX_ACCELERATION = 1000.0
MIN_LIMIT = -600
MAX_LIMIT = 600
[AXIS_Y]
MAX_VELOCITY = 180.0
MAX_ACCELERATION = 1000.0
MIN_LIMIT = -600.0
MAX_LIMIT = 600.0
[AXIS_Z]
MAX_VELOCITY = 180.0
MAX_ACCELERATION = 1000.0
MIN_LIMIT = -600.0
MAX_LIMIT = 835.0
[AXIS_A]
MAX_VELOCITY = 200.0
MAX_ACCELERATION = 500.0
MIN_LIMIT = -360
MAX_LIMIT = 360
[AXIS_B]
MAX_VELOCITY = 200.0
MAX_ACCELERATION = 500.0
MIN_LIMIT = -360
MAX_LIMIT = 360
[AXIS_C]
MAX_VELOCITY = 200.0
MAX_ACCELERATION = 500.0
MIN_LIMIT = -360
MAX_LIMIT = 360

[JOINT_0]
TYPE = ANGULAR
HOME = 0.000
MAX_VELOCITY = 200
MAX_ACCELERATION = 300.0
MIN_LIMIT = -360
MAX_LIMIT = 360
FERROR = 360
MIN_FERROR = 360
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 0
HOME_ABSOLUTE_ENCODER = 2

